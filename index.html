
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">
        <div class="game-icon">🎯</div>

        <h1>Number Guessing Game</h1>
        <p class="subtitle">
            Can you guess the secret number?
        </p>

        <div class="range-box">
            <span>Guess a number between</span>
            <strong>1 and 100</strong>
        </div>

        <form id="guessForm">
            <label for="guessInput">Enter your guess</label>

            <input type="number" id="guessInput" placeholder="Enter a number..." min="1" max="100" required>

            <button type="submit" id="guessButton">
                Check My Guess
            </button>
        </form>

        <div id="message" class="message" aria-live="polite">
            Make your first guess to get started!
        </div>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-icon">🔢</span>
                <p>Attempts</p>
                <h2 id="attempts">0</h2>
            </div>

            <div class="stat-card">
                <span class="stat-icon">📊</span>
                <p>Remaining</p>
                <h2 id="remaining">10</h2>
            </div>
        </div>

        <button id="playAgain" class="restart-button" hidden>
            ↻ Play Again
        </button>

        <p class="footer">Think smart. Guess right. 🎉</p>
    </main>

    <script src="script.js"></script>
</body>

</html>
